#
# Publish existing build artifacts as a GitHub Release.
#
# Why this exists: ponwrt-builder.yml only does `actions/upload-artifact`, so a
# finished build leaves its images inside the run's Artifacts area and nothing
# shows up on the Releases page. Fetching them from a browser over a slow link
# is the only other option.
#
# This workflow pulls an artifact straight from the Actions API on a runner and
# publishes it as a release with checksums. No rebuild, runs in about a minute.
#
# Usage: Actions -> this workflow -> Run workflow
#   artifact_id : numeric id of the artifact
#   run_id      : the run that produced it (must match, or the API returns 0)
#   tag         : release tag to create (or update)
#
name: Publish firmware from artifact

on:
  workflow_dispatch:
    inputs:
      artifact_id:
        description: 'Artifact ID to publish'
        required: true
        type: string
      run_id:
        description: 'Workflow run ID that produced the artifact'
        required: true
        type: string
      tag:
        description: 'Release tag'
        required: true
        type: string
      title:
        description: 'Release title (optional)'
        required: false
        default: ''
        type: string
      pattern:
        description: 'Only publish files matching this glob (empty = all)'
        required: false
        default: ''
        type: string

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Download the artifact from the Actions API
        uses: actions/download-artifact@v4
        with:
          artifact-id: ${{ inputs.artifact_id }}
          path: dl
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.run_id }}

      - name: Collect, inspect and checksum
        env:
          PATTERN: ${{ inputs.pattern }}
        run: |
          set -e
          echo "=== downloaded tree ==="
          find dl -type f -printf '%12s  %p\n' | sort -k2

          # The artifact keeps its own top-level directory, so flatten into a
          # clean out/ instead of leaving a nested dir that trips up globs.
          mkdir -p out
          find dl -mindepth 1 -type f -exec cp -n {} out/ \;
          cd out

          # Optional narrowing: a full target build also contains the non-UBI
          # variants, which run to hundreds of MB and are of no use here.
          if [ -n "$PATTERN" ]; then
            echo "filtering to: $PATTERN (+ manifest / buildinfo)"
            find . -maxdepth 1 -type f \
                 ! -name "$PATTERN" ! -name '*.manifest' ! -name 'version.buildinfo' -delete
          fi

          echo "=== publishing these files ==="
          ls -l
          # The manifest is the ground truth for what actually landed in the
          # rootfs, so show it rather than trusting the saved .config.
          for m in *.manifest; do
            [ -f "$m" ] || continue
            echo "=== $m (installed packages) ==="
            cat "$m"
          done
          find . -maxdepth 1 -type f ! -name sha256sums -exec sha256sum {} \; | sed 's|\./||' > sha256sums
          cat sha256sums
          test -n "$(find . -maxdepth 1 -name '*.itb' -print -quit)" \
            || { echo "::error::no .itb image in the artifact"; exit 1; }

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.title != '' && inputs.title || inputs.tag }}
          files: out/*
          prerelease: true
          generate_release_notes: true
          fail_on_unmatched_files: true
